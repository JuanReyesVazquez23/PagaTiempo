[build]
  command = "npm run build"
  publish = "dist"

# App de una sola página (React Router): cualquier ruta que no sea un
# archivo estático (por ejemplo /panel) debe servir index.html para que
# el router del navegador la maneje. Sin esto, recargar /panel da 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
